<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#102A54" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="logoBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.25" />
    </linearGradient>

    <!-- Cap Left Facet -->
    <linearGradient id="logoCapLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Cap Right Facet -->
    <linearGradient id="logoCapRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="logoCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <filter id="logoCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Container Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#logoBgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#logoBorderGrad)" stroke-width="1.5" />

  <!-- Assessment Checklist Card -->
  <g filter="url(#logoCardShadow)">
    <rect x="16" y="24" width="32" height="33" rx="5" fill="url(#logoCardGrad)" stroke="#CBD5E1" stroke-width="1" />
    <!-- Top Clip / Binder -->
    <rect x="26" y="22" width="12" height="3.5" rx="1.75" fill="#102A54" />
  </g>

  <!-- Checklist Row 1 -->
  <path d="M21 32.5 L23.5 35 L28 30" fill="none" stroke="#0284C7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="31" y="31.5" width="12" height="2" rx="1" fill="#64748B" />

  <!-- Checklist Row 2 -->
  <path d="M21 40.5 L23.5 43 L28 38" fill="none" stroke="#0284C7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="31" y="39.5" width="12" height="2" rx="1" fill="#64748B" />

  <!-- Checklist Row 3 (Featured Success Check) -->
  <path d="M21 48.5 L23.5 51 L28 46" fill="none" stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="31" y="47.5" width="9" height="2" rx="1" fill="#38BDF8" />

  <!-- Graduation Cap Underlayer Band -->
  <path d="M20 18.5 V22.5 C20 26 44 26 44 22.5 V18.5" fill="#0A192F" opacity="0.9" />

  <!-- Graduation Cap (Mortarboard Diamond) -->
  <!-- Left Side (Lighter Cyan-Blue) -->
  <path d="M32 7 L8 15 L32 23 Z" fill="url(#logoCapLeft)" />
  <!-- Right Side (Deeper Blue) -->
  <path d="M32 7 L56 15 L32 23 Z" fill="url(#logoCapRight)" />

  <!-- Center highlight line -->
  <path d="M8 15 L32 23 L56 15" fill="none" stroke="#E0F2FE" stroke-width="0.8" opacity="0.7" />

  <!-- Apex Button -->
  <ellipse cx="32" cy="15" rx="2.5" ry="1.5" fill="#E0F2FE" />

  <!-- Cap Tassel (Hangs down to the right) -->
  <path d="M32 15 Q46 17 48 24 L48 31" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="48" cy="32" r="1.8" fill="#38BDF8" />
  <path d="M46.5 32 L49.5 32 L48.8 35.5 L47.2 35.5 Z" fill="#38BDF8" />
</svg>

