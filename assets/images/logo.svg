<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" width="320" height="56">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#102A54" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="logoBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.25" />
    </linearGradient>

    <!-- Cap Left Facet -->
    <linearGradient id="logoCapLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Cap Right Facet -->
    <linearGradient id="logoCapRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Assessment Card Gradient -->
    <linearGradient id="logoCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="logoCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ==================== ICON EMBLEM (52x52 at x=2, y=2) ==================== -->
  <g transform="translate(2, 2)">
    <!-- Container Rounded Squircle -->
    <rect width="52" height="52" rx="14" fill="url(#logoBgGrad)" />
    <rect x="0.75" y="0.75" width="50.5" height="50.5" rx="13.25" fill="none" stroke="url(#logoBorderGrad)" stroke-width="1.25" />

    <!-- Checklist Document Card -->
    <g filter="url(#logoCardShadow)">
      <rect x="13" y="19.5" width="26" height="27" rx="4" fill="url(#logoCardGrad)" stroke="#CBD5E1" stroke-width="0.8" />
      <!-- Top Card Clip -->
      <rect x="21" y="18" width="10" height="3" rx="1.5" fill="#102A54" />
    </g>

    <!-- Checklist Item 1 -->
    <path d="M17 26.5 L19 28.5 L22.5 24.5" fill="none" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="25" y="25.5" width="10" height="1.8" rx="0.9" fill="#64748B" />

    <!-- Checklist Item 2 -->
    <path d="M17 33 L19 35 L22.5 31" fill="none" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="25" y="32" width="10" height="1.8" rx="0.9" fill="#64748B" />

    <!-- Checklist Item 3 (Success Checked) -->
    <path d="M17 39.5 L19 41.5 L22.5 37.5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="25" y="38.5" width="7" height="1.8" rx="0.9" fill="#38BDF8" />

    <!-- Graduation Cap Band -->
    <path d="M16 15 V18.5 C16 21.5 36 21.5 36 18.5 V15" fill="#0A192F" opacity="0.95" />

    <!-- Graduation Cap Diamond -->
    <!-- Left Wing (Cyan to Blue) -->
    <path d="M26 5.5 L6.5 12 L26 18.5 Z" fill="url(#logoCapLeft)" />
    <!-- Right Wing (Blue to Navy) -->
    <path d="M26 5.5 L45.5 12 L26 18.5 Z" fill="url(#logoCapRight)" />

    <!-- Ridge Highlight -->
    <path d="M6.5 12 L26 18.5 L45.5 12" fill="none" stroke="#E0F2FE" stroke-width="0.75" opacity="0.8" />

    <!-- Mortarboard Button -->
    <ellipse cx="26" cy="12" rx="2" ry="1.2" fill="#E0F2FE" />

    <!-- Cap Tassel (Swinging to Right) -->
    <path d="M26 12 Q37.5 13.5 39 19.5 L39 25.5" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="39" cy="26.5" r="1.5" fill="#38BDF8" />
    <path d="M37.8 26.5 L40.2 26.5 L39.6 29.5 L38.4 29.5 Z" fill="#38BDF8" />
  </g>

  <!-- ==================== BRAND TYPOGRAPHY ==================== -->
  <g transform="translate(66, 0)">
    <!-- Brand Name: SkillTest -->
    <text x="0" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#0A192F">Skill</tspan><tspan fill="#0284C7">Test</tspan>
    </text>

    <!-- Tagline: Smart Skill Assessment Platform -->
    <text x="0.5" y="46" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="7.8" font-weight="700" fill="#0369A1" letter-spacing="1.2">
      SMART SKILL ASSESSMENT PLATFORM
    </text>
  </g>
</svg>
