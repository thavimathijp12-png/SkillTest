# Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration using Environment Variables with Defaults
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skilltest_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Logging
logging.level.com.skilltest=INFO
logging.level.org.springframework.web=INFO
